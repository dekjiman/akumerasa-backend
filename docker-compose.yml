version: '3.8'

services:
  # PHP 8.2 Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akumerasa_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      CI_ENVIRONMENT: development
      database.default.hostname: db
      database.default.database: refleksi_db
      database.default.username: refleksi_user
      database.default.password: refleksi_password
      database.default.DBDriver: MySQLi
      database.default.port: 3306
      HASH_KEY: J5yGAlg9l9qDqRC4YKjrULtZjn4zLzWCY38Eh9aaFxG
      JWT_SECRET: dev_secret_jwt_key_1234567890_akumerasa
      JWT_TIME_TO_LIVE: 86400
    depends_on:
      db:
        condition: service_healthy

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: akumerasa_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # MariaDB Database
  db:
    image: mariadb:10.9
    container_name: akumerasa_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: refleksi_db
      MYSQL_USER: refleksi_user
      MYSQL_PASSWORD: refleksi_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
    driver: local
