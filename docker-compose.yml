version: '3.8'

services:
  # PHP 8.2 Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akumerasa_app
    restart: unless-stopped
    volumes:
      - app_writable:/var/www/html/writable
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT:-production}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080/}
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-refleksi_db}
      DB_USER: ${DB_USER:-refleksi_user}
      DB_PASS: ${DB_PASS:-refleksi_password}
      DB_PORT: ${DB_PORT:-3306}
      database.default.hostname: ${DB_HOST:-db}
      database.default.database: ${DB_NAME:-refleksi_db}
      database.default.username: ${DB_USER:-refleksi_user}
      database.default.password: ${DB_PASS:-refleksi_password}
      database.default.DBDriver: MySQLi
      database.default.port: ${DB_PORT:-3306}
      HASH_KEY: ${HASH_KEY:-J5yGAlg9l9qDqRC4YKjrULtZjn4zLzWCY38Eh9aaFxG}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_jwt_key_1234567890_akumerasa}
      JWT_TIME_TO_LIVE: ${JWT_TIME_TO_LIVE:-86400}
    depends_on:
      - db

  # Nginx Web Server
  web:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: akumerasa_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - app

  # MariaDB Database
  db:
    image: mariadb:11.3
    container_name: akumerasa_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass_2026#}
      MYSQL_DATABASE: ${DB_NAME:-refleksi_db}
      MYSQL_USER: ${DB_USER:-refleksi_user}
      MYSQL_PASSWORD: ${DB_PASS:-refleksipass_2026#}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./data:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${DB_ROOT_PASS:-root_password} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mariadb_data:
    driver: local
  app_writable:
    driver: local
